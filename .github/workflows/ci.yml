name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not compose"

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdip
          POSTGRES_PASSWORD: sdip
          POSTGRES_DB: sdip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdip -d sdip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://sdip:sdip@127.0.0.1:5432/sdip
        run: uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- --host 127.0.0.1 &
      - name: Wait for application
        run: |
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:5173/
      - run: npm run test:browser
        working-directory: frontend

  stack-tests:
    name: Compose integration and E2E tests
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    env:
      APP_PORT: "18000"
      POSTGRES_PORT: "15432"
      COMPOSE_PROJECT_NAME: ai-interview-canvas-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chrome
        working-directory: e2e
      - name: Build and start Compose stack
        run: docker compose up --build --detach --wait
      - name: Run integration tests
        working-directory: backend
        env:
          TEST_COMPOSE_REUSE: "1"
        run: uv run pytest tests_integration -q -m compose --run-compose
      - name: Run end-to-end tests
        working-directory: e2e
        env:
          E2E_SKIP_COMPOSE: "1"
          E2E_APP_PORT: "18000"
        run: npm test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
