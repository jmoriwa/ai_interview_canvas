services:
  # Keep this name unchanged: Render derives the existing production URL from it.
  - type: web
    name: ai-interview-canvas
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-canvas-production
          property: connectionString

  # main is the integration branch. Render waits for GitHub CI before deploying it.
  - type: web
    name: ai-interview-canvas-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-canvas-development
          property: connectionString

databases:
  - name: ai-interview-canvas-production
    databaseName: interview_canvas_production
    user: interview_canvas_production

  - name: ai-interview-canvas-development
    databaseName: interview_canvas_development
    user: interview_canvas_development
