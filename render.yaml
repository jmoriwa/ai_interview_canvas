services:
  # Production is intentionally not in this Blueprint. It remains unmanaged.
  # main is the integration branch. Render waits for GitHub CI before deploying it.
  - type: web
    name: ai-interview-canvas-dev
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        sync: false
